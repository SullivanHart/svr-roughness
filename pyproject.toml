[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "svr-roughness"
dynamic = ["version"]
description = "Fast, standard-compliant areal surface roughness analysis (Sa, Sq, Svr) in pure Python (NumPy/SciPy)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Sullivan Hart" },
  { name = "HAM Lab, Iowa State University" }
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10"
]
keywords = ["roughness", "point-cloud", "ply", "surface-metrology"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/sullivanhart/svr-roughness"
Issues = "https://github.com/sullivanhart/svr-roughness/issues"

[project.scripts]
svr-roughness = "svr_roughness.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_file = "src/svr_roughness/_version.py"
fallback_version = "0.1.0"

