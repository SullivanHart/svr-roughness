[build-system]
requires = ["scikit-build-core>=0.10", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "svr-roughness"
dynamic = ["version"]
description = "Fast, standard-compliant areal surface roughness analysis (Sa, Sq, Svr) using CGAL & PCL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Sullivan Hart" },
  { name = "HAM Lab, Iowa State University" }
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10"
]
keywords = ["roughness", "point-cloud", "ply", "surface-metrology"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering"
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.0", "mypy>=1.11"]

[project.urls]
Repository = "https://github.com/sullivanhart/svr-roughness"
Issues = "https://github.com/sullivanhart/svr-roughness/issues"

[project.scripts]
svr-roughness = "svr_roughness.__main__:main"

[tool.scikit-build]
cmake.version = ">=3.20"
cmake.source-dir = "native"
build-dir = "native/build"
wheel.packages = ["src/svr_roughness"]
wheel.py-api = "py3"
sdist.include = [
  "native/CMakeLists.txt",
  "native/*.cpp",
  "native/*.h",
  "native/vcpkg.json",
  "src/svr_roughness/**",
  "tests/**",
  "README.md"
]
sdist.exclude = [
  "native/build/**",
  "native/vcpkg_installed/**",
  "**/.pytest_cache/**",
  "**/__pycache__/**"
]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
version_file = "src/svr_roughness/_version.py"
fallback_version = "0.0.0.dev0"
