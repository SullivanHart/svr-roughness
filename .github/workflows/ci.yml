name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so setuptools-scm can read tags

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: |
          pip install numpy scipy pytest setuptools-scm

      - name: Generate _version.py from git tags
        run: |
          python -c "import setuptools_scm; setuptools_scm.get_version(write_to='src/svr_roughness/_version.py')"

      - name: Run unit tests (no native DLL required)
        env:
          PYTHONPATH: src
        run: |
          pytest tests/test_config.py tests/test_io.py -v

  build-smoke:
    name: Build Smoke Test (Linux)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install C++ dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake build-essential libpcl-dev libcgal-dev \
            libboost-system-dev libboost-filesystem-dev libtbb-dev libeigen3-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tools
        run: pip install build scikit-build-core setuptools-scm

      - name: Build wheel (verify it compiles)
        run: python -m build --wheel
