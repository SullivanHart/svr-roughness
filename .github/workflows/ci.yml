name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so setuptools-scm can read tags

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: |
          pip install numpy scipy pytest setuptools-scm

      - name: Generate _version.py from git tags
        run: |
          python -c "import setuptools_scm; setuptools_scm.get_version(write_to='src/svr_roughness/_version.py')"

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: |
          pytest tests/ -v

  build-smoke:
    name: Build & Install Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tools
        run: pip install build setuptools-scm

      - name: Build wheel
        run: python -m build --wheel

      - name: Install and verify wheel
        run: |
          pip install dist/*.whl
          python -c "import svr_roughness; print(f'Installed svr-roughness {svr_roughness.__version__}')"

