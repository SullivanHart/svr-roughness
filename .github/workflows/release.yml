name: Build and Publish Multi-Platform Wheels

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'src/svr_roughness/__init__.py'
  workflow_dispatch:

jobs:
  build_linux_wheels:
    name: Build Linux Wheel (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64

    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,file_stat_matches

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-${{ matrix.arch }}-apt-v1

      - name: Install Linux C++ Dependencies (PCL, CGAL, Boost, TBB, Eigen, patchelf)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libpcl-dev libcgal-dev libboost-system-dev libboost-filesystem-dev libtbb-dev libeigen3-dev patchelf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ matrix.arch }}-ccache
          max-size: 500M
          save-always: true

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build auditwheel patchelf scikit-build-core

      - name: Build wheel and sdist
        run: |
          python -m build
          auditwheel repair dist/*.whl -w dist/
          rm -f dist/*-linux_x86_64.whl dist/*-linux_aarch64.whl

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/

  build_windows_wheel:
    name: Build Windows Wheel (x86_64)
    runs-on: windows-2022
    env:
      CMAKE_TOOLCHAIN_FILE: 'C:/vcpkg/scripts/buildsystems/vcpkg.cmake'
      VCPKG_TARGET_TRIPLET: 'x64-windows-release'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache vcpkg installed dependencies
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/Users/runneradmin/AppData/Local/vcpkg/archives
          key: ${{ runner.os }}-vcpkg-release-v3-${{ hashFiles('native/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-release-v3-

      - name: Pre-install vcpkg dependencies (Release triplet only)
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          cd native
          vcpkg install --triplet x64-windows-release

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-x64-ccache
          max-size: 500M
          save-always: true

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build scikit-build-core

      - name: Build Windows Wheel
        run: |
          python -m build --wheel

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*.whl

  build_macos_wheel:
    name: Build macOS Wheel (ARM64 Apple Silicon)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install macOS C++ Dependencies via Homebrew
        run: |
          brew install cmake cgal pcl boost tbb eigen

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-arm64-ccache
          max-size: 500M
          save-always: true

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build scikit-build-core

      - name: Build macOS Wheel
        run: |
          python -m build --wheel

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*.whl

  publish_pypi:
    name: Publish to PyPI
    needs: [build_linux_wheels, build_windows_wheel, build_macos_wheel]
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download all dist artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

