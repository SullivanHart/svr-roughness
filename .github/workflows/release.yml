name: Build and Publish Linux & Windows Wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_linux_wheel:
    name: Build Linux Wheel & Sdist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux C++ Dependencies (PCL, CGAL, Boost, TBB, Eigen)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libpcl-dev libcgal-dev libboost-system-dev libboost-filesystem-dev libtbb-dev libeigen3-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine scikit-build-core

      - name: Build wheel and sdist
        run: |
          python -m build

      - name: Publish wheels to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload --skip-existing dist/*

