name: Build and Publish Linux & Windows Wheels

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'src/svr_roughness/__init__.py'
  workflow_dispatch:

jobs:
  build_linux_wheels:
    name: Build Linux Wheel (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64

    permissions:
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux C++ Dependencies (PCL, CGAL, Boost, TBB, Eigen, patchelf)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libpcl-dev libcgal-dev libboost-system-dev libboost-filesystem-dev libtbb-dev libeigen3-dev patchelf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ matrix.arch }}-ccache

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build auditwheel patchelf scikit-build-core

      - name: Build wheel and sdist
        run: |
          python -m build
          auditwheel repair dist/*.whl -w dist/
          rm -f dist/*-linux_x86_64.whl dist/*-linux_aarch64.whl

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

