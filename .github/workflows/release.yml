name: Release — Build & Publish Universal Wheel

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════════════
  #  Build Universal Wheel & sdist
  # ═══════════════════════════════════════════════════════════════════
  build:
    name: Build Universal Wheel & sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tools
        run: pip install build setuptools-scm

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  # ═══════════════════════════════════════════════════════════════════
  #  Cross-Platform & Multi-Python Matrix Tests
  # ═══════════════════════════════════════════════════════════════════
  test_matrix:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install wheel and test dependencies
        shell: bash
        run: |
          pip install dist/*.whl pytest

      - name: Run test suite on installed package
        shell: bash
        run: |
          pytest tests/ -v --tb=short

  # ═══════════════════════════════════════════════════════════════════
  #  Publish to PyPI (Trusted Publisher — OIDC, no stored tokens)
  # ═══════════════════════════════════════════════════════════════════
  publish_pypi:
    name: Publish to PyPI
    needs: [test_matrix]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

