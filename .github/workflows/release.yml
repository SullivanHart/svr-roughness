name: Build and Publish Linux & Windows Wheels

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'src/svr_roughness/__init__.py'
  workflow_dispatch:

jobs:
  build_linux_wheel:
    name: Build Linux Wheel & Sdist
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux C++ Dependencies (PCL, CGAL, Boost, TBB, Eigen)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libpcl-dev libcgal-dev libboost-system-dev libboost-filesystem-dev libtbb-dev libeigen3-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build scikit-build-core

      - name: Build wheel and sdist
        run: |
          python -m build -Cwheel.plat-name=manylinux_2_34_x86_64

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

