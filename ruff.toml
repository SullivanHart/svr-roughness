# Ruff linter & formatter configuration for svr-roughness
# https://docs.astral.sh/ruff/configuration/

target-version = "py310"
line-length = 120

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by formatter
    "SIM108", # ternary operator — readability preference
    "UP007",  # X | Y union syntax — keep Optional for clarity
    "B905",   # zip() without strict= — lengths always match by construction
]

[lint.per-file-ignores]
"tests/*" = ["B011", "SIM300"]
"src/svr_roughness/result.py" = ["RUF001"]   # intentional Unicode: σ, ×, –, § in ASTM report output
"src/svr_roughness/analyze.py" = ["RUF003"]  # intentional Unicode × in comment
"src/svr_roughness/_display_grid.py" = ["RUF003"]

[format]
quote-style = "double"
indent-style = "space"
